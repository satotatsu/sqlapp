plugins {
	id("io.freefair.lombok")
	id('eclipse')
	id('java-library')	
}

java {
	withJavadocJar();
	withSourcesJar();
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

test {
	enabled = false
}

sourceSets {
	dockerTest {
		java.srcDir file('src/dockerTest/java')
		resources.srcDir file('src/dockerTest/resources')
		compileClasspath += sourceSets.main.output
		runtimeClasspath += output + compileClasspath
	}
}

configurations {
	dockerTestImplementation.extendsFrom testImplementation
	dockerTestRuntimeOnly.extendsFrom testRuntimeOnly
}

tasks.register('dockerTest', Test) {
	description = 'Runs opt-in Testcontainers dialect integration tests.'
	group = 'verification'
	testClassesDirs = sourceSets.dockerTest.output.classesDirs
	classpath = sourceSets.dockerTest.runtimeClasspath
	useJUnitPlatform()
	shouldRunAfter tasks.named('test')
	def testcontainersReuse = providers.gradleProperty('testcontainersReuse')
		.map { it.toBoolean() }.orElse(false)
	systemProperty 'sqlapp.testcontainers.reuse', testcontainersReuse.get()
	def oracleTestImage = providers.gradleProperty('oracleTestImage')
		.orElse('gvenzl/oracle-free:23-slim-faststart')
	def oracleExpectedDialect = providers.gradleProperty('oracleExpectedDialect').orElse('23ai')
	systemProperty 'sqlapp.test.oracle.image', oracleTestImage.get()
	systemProperty 'sqlapp.test.oracle.expectedDialect', oracleExpectedDialect.get()
	def yugabyteTestImage = providers.gradleProperty('yugabyteTestImage')
		.orElse('yugabytedb/yugabyte:2026.1.2.0-b137')
	systemProperty 'sqlapp.test.yugabyte.image', yugabyteTestImage.get()
	if (testcontainersReuse.get()) {
		environment 'TESTCONTAINERS_REUSE_ENABLE', 'true'
	}
	if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
			&& !System.getenv('DOCKER_HOST')) {
		// Rancher Desktop's documented endpoint for native Windows clients.
		environment 'DOCKER_HOST', 'npipe:////./pipe/docker_engine'
	}
	testLogging {
		showStandardStreams = true
		events "skipped", "passed", "failed", "standardOut", "standardError"
		exceptionFormat = 'full'
	}
	jvmArgs(
		"--add-opens", "java.base/java.lang=ALL-UNNAMED",
		"--add-opens", "java.base/java.util=ALL-UNNAMED"
	)
}

tasks.named('test') {
	// Use JUnit Platform for unit tests.
	useJUnitPlatform()
	testLogging {
		// テスト時の標準出力と標準エラー出力を表示する
		showStandardStreams = true
		// イベントを出力する (TestLogEvent)
		//events "started", "skipped", "passed", "failed", "standardOut", "standardError"
		events "skipped", "passed", "failed", "standardOut", "standardError"
		// 例外発生時の出力設定 (TestExceptionFormat)
		exceptionFormat = 'full'
	}
	jvmArgs(
		"--add-opens", "java.base/java.lang=ALL-UNNAMED",
		"--add-opens", "java.base/java.util=ALL-UNNAMED"
	)
}

