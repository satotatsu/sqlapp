// Fixed, disposable compatibility matrix; never part of the default unit test task.
['11': 'yugabytedb/yugabyte:2024.2.11.0-b36',
 '15': 'yugabytedb/yugabyte:2026.1.2.0-b137'].each { engine, image ->
	tasks.register("yugabyte${engine}CompatibilityTest", Test) {
		description = "Verifies YSQL compatibility on the PostgreSQL ${engine} engine baseline."
		group = 'verification'
		testClassesDirs = sourceSets.dockerTest.output.classesDirs
		classpath = sourceSets.dockerTest.runtimeClasspath
		useJUnitPlatform()
		filter.includeTestsMatching 'com.sqlapp.data.db.dialect.test.yugabyte.YugabyteMetadataReaderTest'
		systemProperty 'sqlapp.test.yugabyte.image', image
		systemProperty 'sqlapp.test.yugabyte.expectedEngineMajor', engine
		systemProperty 'sqlapp.testcontainers.reuse', false
		if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows') && !System.getenv('DOCKER_HOST')) {
			environment 'DOCKER_HOST', 'npipe:////./pipe/docker_engine'
		}
		jvmArgs '--add-opens', 'java.base/java.lang=ALL-UNNAMED', '--add-opens', 'java.base/java.util=ALL-UNNAMED'
		testLogging {
			events 'passed', 'skipped', 'failed'
			exceptionFormat = 'full'
		}
	}
}
tasks.named('yugabyte15CompatibilityTest') {
	mustRunAfter tasks.named('yugabyte11CompatibilityTest')
}
tasks.register('yugabyteCompatibilityTest') {
	description = 'Runs the fixed PostgreSQL 11 and 15 YSQL compatibility matrix in disposable containers.'
	group = 'verification'
	dependsOn tasks.named('yugabyte11CompatibilityTest'), tasks.named('yugabyte15CompatibilityTest')
}

// CockroachDB integration is opt-in and only uses owned disposable containers.
['24': 'cockroachdb/cockroach:v24.3.0', '25': 'cockroachdb/cockroach:v25.4.0'].each { baseline, image ->
	tasks.register("cockroach${baseline}CompatibilityTest", Test) {
		description = "Verifies CockroachDB ${baseline} schema/XML/DDL and bulk compatibility."
		group = 'verification'
		testClassesDirs = sourceSets.dockerTest.output.classesDirs
		classpath = sourceSets.dockerTest.runtimeClasspath
		useJUnitPlatform()
		filter.includeTestsMatching 'com.sqlapp.data.db.dialect.test.cockroach.CockroachMetadataReaderTest'
		systemProperty 'sqlapp.test.cockroach.image', image
		systemProperty 'sqlapp.test.cockroach.expectedVersion', image.substring(image.lastIndexOf(':') + 1)
		if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows') && !System.getenv('DOCKER_HOST')) {
			environment 'DOCKER_HOST', 'npipe:////./pipe/docker_engine'
		}
		jvmArgs '--add-opens', 'java.base/java.lang=ALL-UNNAMED', '--add-opens', 'java.base/java.util=ALL-UNNAMED'
		testLogging { events 'passed', 'skipped', 'failed'; exceptionFormat = 'full' }
	}
}
tasks.named('cockroach25CompatibilityTest') { mustRunAfter tasks.named('cockroach24CompatibilityTest') }
tasks.register('cockroachCompatibilityTest') {
	description = 'Runs the fixed CockroachDB 24.3/25.4 compatibility matrix in disposable containers.'
	group = 'verification'
	dependsOn tasks.named('cockroach24CompatibilityTest'), tasks.named('cockroach25CompatibilityTest')
}

// These are upstream PostgreSQL checks, not Aurora engine emulation.
['14': 'postgres:14.22', '15': 'postgres:15.17', '16': 'postgres:16.13', '17': 'postgres:17.9'].each { engine, image ->
	tasks.register("auroraPostgres${engine}CompatibilityTest", Test) {
		group = 'verification'
		description = "Checks the Aurora dialect on upstream PostgreSQL ${engine}; no Aurora service verification."
		testClassesDirs = sourceSets.dockerTest.output.classesDirs
		classpath = sourceSets.dockerTest.runtimeClasspath
		useJUnitPlatform()
		filter.includeTestsMatching 'com.sqlapp.data.db.dialect.test.aurora.postgres.AuroraPostgresCompatibilityTest'
		systemProperty 'sqlapp.test.aurora.postgresImage', image
		if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows') && !System.getenv('DOCKER_HOST')) {
			environment 'DOCKER_HOST', 'npipe:////./pipe/docker_engine'
		}
		jvmArgs '--add-opens', 'java.base/java.lang=ALL-UNNAMED', '--add-opens', 'java.base/java.util=ALL-UNNAMED'
		testLogging { events 'passed', 'skipped', 'failed'; exceptionFormat = 'full' }
	}
}
(15..17).each { engine -> tasks.named("auroraPostgres${engine}CompatibilityTest") { mustRunAfter tasks.named("auroraPostgres${engine - 1}CompatibilityTest") } }
tasks.register('auroraPostgresCompatibilityTest') {
	group = 'verification'
	description = 'Runs upstream PostgreSQL 14-17 checks for the Aurora dialect. Does not connect to Aurora.'
	dependsOn tasks.named('auroraPostgres14CompatibilityTest'), tasks.named('auroraPostgres15CompatibilityTest'), tasks.named('auroraPostgres16CompatibilityTest'), tasks.named('auroraPostgres17CompatibilityTest')
}
tasks.named('dockerTest') { exclude '**/aurora/postgres/AuroraExternalTest.class' }
tasks.register('auroraExternalTest', Test) {
	group = 'verification'
	description = 'Opt-in destructive checks against an explicitly authorized disposable Aurora database.'
	testClassesDirs = sourceSets.dockerTest.output.classesDirs
	classpath = sourceSets.dockerTest.runtimeClasspath
	useJUnitPlatform()
	filter.includeTestsMatching 'com.sqlapp.data.db.dialect.test.aurora.postgres.AuroraExternalTest'
	outputs.upToDateWhen { false }
	doFirst {
		if (System.getenv('SQLAPP_AURORA_ALLOW_DESTRUCTIVE_TESTS') != 'true') {
			throw new GradleException('Explicit SQLAPP_AURORA_ALLOW_DESTRUCTIVE_TESTS=true is required for an authorized disposable Aurora database.')
		}
	}
}

// Official Omni engines. Managed Google Cloud AlloyDB is outside this matrix.
['15': 'google/alloydbomni:15.17.0', '16': 'google/alloydbomni:16.8.0', '17': 'google/alloydbomni:17.9.0'].each { engine, image ->
	tasks.register("alloydb${engine}CompatibilityTest", Test) {
		group = 'verification'
		description = "Verifies the official AlloyDB Omni ${engine} engine in a disposable container."
		testClassesDirs = sourceSets.dockerTest.output.classesDirs
		classpath = sourceSets.dockerTest.runtimeClasspath
		useJUnitPlatform()
		filter.includeTestsMatching 'com.sqlapp.data.db.dialect.test.alloydb.AlloyDBOmniCompatibilityTest'
		systemProperty 'sqlapp.test.alloydb.image', image
		systemProperty 'sqlapp.test.alloydb.expectedEngineMajor', engine
		if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows') && !System.getenv('DOCKER_HOST')) {
			environment 'DOCKER_HOST', 'npipe:////./pipe/docker_engine'
		}
		jvmArgs '--add-opens', 'java.base/java.lang=ALL-UNNAMED', '--add-opens', 'java.base/java.util=ALL-UNNAMED'
		testLogging { events 'passed', 'skipped', 'failed'; exceptionFormat = 'full' }
	}
}
tasks.named('alloydb16CompatibilityTest') { mustRunAfter tasks.named('alloydb15CompatibilityTest') }
tasks.named('alloydb17CompatibilityTest') { mustRunAfter tasks.named('alloydb16CompatibilityTest') }
tasks.register('alloydbPostgresControlTest', Test) {
	group = 'verification'
	testClassesDirs = sourceSets.dockerTest.output.classesDirs
	classpath = sourceSets.dockerTest.runtimeClasspath
	useJUnitPlatform()
	filter.includeTestsMatching 'com.sqlapp.data.db.dialect.test.alloydb.AlloyDBPostgresControlTest'
	if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows') && !System.getenv('DOCKER_HOST')) {
		environment 'DOCKER_HOST', 'npipe:////./pipe/docker_engine'
	}
	jvmArgs '--add-opens', 'java.base/java.lang=ALL-UNNAMED', '--add-opens', 'java.base/java.util=ALL-UNNAMED'
	testLogging { events 'passed', 'skipped', 'failed'; exceptionFormat = 'full' }
	mustRunAfter tasks.named('alloydb17CompatibilityTest')
}
tasks.register('alloydbCompatibilityTest') {
	group = 'verification'
	description = 'Runs the official Omni 15/16/17 matrix and ordinary PostgreSQL identification control.'
	dependsOn tasks.named('alloydb15CompatibilityTest'), tasks.named('alloydb16CompatibilityTest'), tasks.named('alloydb17CompatibilityTest'), tasks.named('alloydbPostgresControlTest')
}

tasks.named('dockerTest') { exclude '**/alloydb/AlloyDBExternalTest.class' }
tasks.register('alloydbExternalTest', Test) {
	group = 'verification'
	description = 'Opt-in destructive checks on an explicitly authorized disposable managed AlloyDB database.'
	testClassesDirs = sourceSets.dockerTest.output.classesDirs
	classpath = sourceSets.dockerTest.runtimeClasspath
	useJUnitPlatform()
	filter.includeTestsMatching 'com.sqlapp.data.db.dialect.test.alloydb.AlloyDBExternalTest'
	outputs.upToDateWhen { false }
	doFirst {
		if (System.getenv('SQLAPP_ALLOYDB_ALLOW_DESTRUCTIVE_TESTS') != 'true') {
			throw new GradleException('Explicit SQLAPP_ALLOYDB_ALLOW_DESTRUCTIVE_TESTS=true is required for an authorized disposable AlloyDB database.')
		}
	}
}
