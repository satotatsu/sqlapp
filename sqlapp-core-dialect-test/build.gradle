plugins {
	id("io.freefair.lombok")
	id('eclipse')
	id('java-library')	
}

java {
	withJavadocJar();
	withSourcesJar();
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

test {
	enabled = false
}

sourceSets {
	dockerTest {
		java.srcDir file('src/dockerTest/java')
		resources.srcDir file('src/dockerTest/resources')
		compileClasspath += sourceSets.main.output
		runtimeClasspath += output + compileClasspath
	}
}

configurations {
	dockerTestImplementation.extendsFrom testImplementation
	dockerTestRuntimeOnly.extendsFrom testRuntimeOnly
}

tasks.register('dockerTest', Test) {
	description = 'Runs opt-in Testcontainers dialect integration tests.'
	group = 'verification'
	testClassesDirs = sourceSets.dockerTest.output.classesDirs
	classpath = sourceSets.dockerTest.runtimeClasspath
	useJUnitPlatform()
	shouldRunAfter tasks.named('test')
	if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
			&& !System.getenv('DOCKER_HOST')) {
		// Rancher Desktop's documented endpoint for native Windows clients.
		environment 'DOCKER_HOST', 'npipe:////./pipe/docker_engine'
	}
	testLogging {
		showStandardStreams = true
		events "skipped", "passed", "failed", "standardOut", "standardError"
		exceptionFormat = 'full'
	}
	jvmArgs(
		"--add-opens", "java.base/java.lang=ALL-UNNAMED",
		"--add-opens", "java.base/java.util=ALL-UNNAMED"
	)
}

tasks.named('test') {
	// Use JUnit Platform for unit tests.
	useJUnitPlatform()
	testLogging {
		// テスト時の標準出力と標準エラー出力を表示する
		showStandardStreams = true
		// イベントを出力する (TestLogEvent)
		//events "started", "skipped", "passed", "failed", "standardOut", "standardError"
		events "skipped", "passed", "failed", "standardOut", "standardError"
		// 例外発生時の出力設定 (TestExceptionFormat)
		exceptionFormat = 'full'
	}
	jvmArgs(
		"--add-opens", "java.base/java.lang=ALL-UNNAMED",
		"--add-opens", "java.base/java.util=ALL-UNNAMED"
	)
}

