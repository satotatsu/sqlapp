plugins {
	id ('com.sqlapp.maven-deploy')
}

dependencies {
	implementation project(':sqlapp-core')
	implementation('com.vertica.jdbc:vertica-jdbc:25.3.0-0')
	testImplementation project(':sqlapp-core-test')
}

javadoc {
	include '**/vertica/*'
}

// Never include the destructive, explicitly authorized database qualification in
// normal module tests, even when integration environment variables are present.
tasks.named('test', Test) {
	exclude '**/VerticaProjectionIntegrationTest.class'
}

tasks.register('projectionIntegrationTest', Test) {
	description = 'Explicitly authorized disposable Vertica Projection qualification only'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	include '**/VerticaProjectionIntegrationTest.class'
}
