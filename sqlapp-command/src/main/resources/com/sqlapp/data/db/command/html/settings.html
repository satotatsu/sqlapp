@code{
int i=0;
int j=0;
int no=1;
}
<div class="panel panel-default">
	<div class="header">
	</div>
	<div class="body">
		<!-- include(incSearchable.html) -->
		<table id="mainTable" @{attr("class", renderOptions.tableClass)}>
		<thead>
			<tr>
				<!-- include(incTableSchemaHeader.html) -->
				<th rowspan="2" @{renderOptions.tableHeaderColAttr("Value")}>Value</th>
				@if{_prefix.defaultValueCount>0}
				<th rowspan="2" @{renderOptions.tableHeaderColAttr("DefaultValue")}>Default Value</th>
				@end{}
				<!-- include(incTableHeader1.html) -->
			</tr>
			<tr>
				<!-- include(incTableHeader2.html) -->
			</tr>
		</thead>
		<tfoot>
			<tr>
				<!-- include(incTableSchemaFooter.html) -->
				<td @{renderOptions.tableHeaderColAttr("Value")}></td>
				@if{_prefix.defaultValueCount>0}
				<td @{renderOptions.tableHeaderColAttr("DefaultValue")}></td>
				@end{}
				<!-- include(incTableFooter.html) -->
			</tr>
		</tfoot>
		<tbody class="tbody_class">@foreach{obj : list}
			<tr>
				<!-- include(incTableSchemaBodyNoDetail.html) -->
				<td @{renderOptions.tableBodyColAttr("Value")}>@{coalesce(obj.value, "")}</td>
				@if{_prefix.defaultValueCount>0}
				<td @{renderOptions.tableBodyColAttr("DefaultValue")}>@{coalesce(obj.defaultValue, "")}</td>
				@end{}
				<!-- include(incTableBody.html) -->
			</tr>@end{}
		</tbody>
		</table>
	</div>
</div>
